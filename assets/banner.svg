<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4169d8"/>
      <stop offset="0.55" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#8fa6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- 装饰圆 -->
  <circle cx="1156" cy="150" r="150" fill="#ffffff" opacity="0.08"/>
  <circle cx="1230" cy="560" r="96" fill="#ffffff" opacity="0.10"/>
  <circle cx="180" cy="596" r="170" fill="#ffffff" opacity="0.05"/>

  <!-- Logo 爱心 -->
  <g transform="translate(150,140)">
    <circle cx="85" cy="85" r="85" fill="#ffffff" opacity="0.18"/>
    <path d="M85 128 C 52 102 22 82 34 52 C 42 30 70 34 85 56 C 100 34 128 30 136 52 C 148 82 118 102 85 128 Z"
          fill="#ffd08a" opacity="0.95"/>
  </g>

  <text x="130" y="352" font-size="78" font-weight="bold" fill="#ffffff">心语伴 · Heartbuddy</text>
  <text x="132" y="416" font-size="32" fill="#e8eefc">AI 情绪陪伴小程序 · 2026 微信小程序开发大赛（AI + 小程序）参赛作品</text>

  <!-- 功能标签 -->
  <g font-size="26" fill="#ffffff">
    <rect x="130" y="478" width="300" height="52" rx="26" fill="#ffffff" opacity="0.16" stroke="#ffffff" stroke-opacity="0.55"/>
    <text x="280" y="512" text-anchor="middle">AI 多轮情绪对话</text>

    <rect x="444" y="478" width="254" height="52" rx="26" fill="#ffffff" opacity="0.16" stroke="#ffffff" stroke-opacity="0.55"/>
    <text x="571" y="512" text-anchor="middle">情绪记录与周报</text>

    <rect x="712" y="478" width="224" height="52" rx="26" fill="#ffffff" opacity="0.16" stroke="#ffffff" stroke-opacity="0.55"/>
    <text x="824" y="512" text-anchor="middle">危机安全分级</text>

    <rect x="130" y="544" width="224" height="52" rx="26" fill="#ffffff" opacity="0.16" stroke="#ffffff" stroke-opacity="0.55"/>
    <text x="242" y="578" text-anchor="middle">考前焦虑自评</text>

    <rect x="368" y="544" width="280" height="52" rx="26" fill="#ffffff" opacity="0.16" stroke="#ffffff" stroke-opacity="0.55"/>
    <text x="508" y="578" text-anchor="middle">canvas 心情分享卡</text>

    <rect x="662" y="544" width="252" height="52" rx="26" fill="#ffffff" opacity="0.16" stroke="#ffffff" stroke-opacity="0.55"/>
